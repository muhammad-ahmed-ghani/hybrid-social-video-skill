name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and fontconfig
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fontconfig
      - name: Install Python dependencies
        run: pip install pytest pillow numpy opencv-python-headless playwright
      - name: Install a browser for the render route tests
        run: playwright install --with-deps chromium
      - name: Validate the skill and check the committed .skill is current
        run: python3 tools/package_skill.py --check
      - name: Run tests
        run: python3 -m pytest -q skills/social-explainer-reel/tests/
