<!doctype html>
<!-- Faceless route-L composition: a pure function of time. Reads window.VIDEO (data.js, written by scripts/build_video.py) and draws one
     scene per beat from its `scene` spec, with captions that follow the voice's own word times. Contract for scripts/render_html.py:
     window.render(t) and window.DUR. No timers, no wall clock, no randomness. All text is measured and fitted inside the safe box. -->
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}
  svg{position:absolute;left:0;top:0;width:1080px;height:1920px}
  #cap{position:absolute;left:120px;width:768px;top:1112px;display:flex;justify-content:center}
  #cap .pill{border-radius:14px;padding:12px 20px;font-weight:700;font-size:48px;line-height:1.15;text-align:center;white-space:nowrap}
</style></head>
<body><div id="stage">
<svg id="bg" viewBox="0 0 1080 1920"></svg>
<svg id="art" viewBox="0 0 1080 1920"></svg>
<div id="cap"></div>
</div>
<script src="data.js"></script>
<script>
const V=window.VIDEO,B=V.beats,D=V.duration,ST=V.style,TK=ST.tokens,FH=ST.fonts.hero_stack,FB=ST.fonts.body_stack,FM=ST.fonts.mono_stack;
const SAFE=ST.safe||{x:120,y:288,w:768,h:960},CX=SAFE.x+SAFE.w/2;
const ART={x:SAFE.x+24,y:372,w:SAFE.w-48,h:700};         // narrower than the safe box so the slow push never crosses its edge
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const eo=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.5;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};   // a little overshoot on arrival
const pr=(t,a,d)=>clamp((t-a)/d);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const vs=B.map((b,i)=>i===0?0:Math.max(b.s-0.2,0)),ve=B.map((b,i)=>i===B.length-1?D:Math.max(vs[i+1],vs[i]+0.4));
const cv=document.createElement('canvas').getContext('2d');
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'');

// ---- text: measured, wrapped, shrunk to fit; never overflows the safe box ----
function wrap(text,size,weight,stack,maxW){cv.font=`${weight} ${size}px ${stack}`;const out=[];let cur='';
  for(const w of String(text).split(/\s+/)){const test=cur?cur+' '+w:w;if(!cur||cv.measureText(test).width<=maxW)cur=test;else{out.push(cur);cur=w}}
  if(cur)out.push(cur);return out}
function fit(text,size,min,weight,stack,maxW,maxLines=2,prefer='lines'){
  const ok=(sz,n)=>{const l=wrap(text,sz,weight,stack,maxW);return l.length<=n&&l.every(x=>cv.measureText(x).width<=maxW)?{size:sz,lines:l}:null};
  if(prefer==='size'){for(let s=size;s>=min;s-=4){const r=ok(s,maxLines);if(r)return r}}
  else for(let n=1;n<=maxLines;n++)for(let s=size;s>=min;s-=4){const r=ok(s,n);if(r)return r}     // fewest lines first: a label is better small and whole than big and wrapped
  return{size:min,lines:wrap(text,min,weight,stack,maxW)}}
let BID=0;
function tx(x,y,text,o={}){const bid=BID++;const stack=o.stack||FB,w=o.w||700,f=fit(text,o.size||48,o.min||40,w,stack,o.maxW||ART.w,o.maxLines||2,o.prefer);
  const lh=f.size*1.12,a=o.a||'middle',y0=o.vc?y-(f.lines.length-1)*lh/2+f.size*0.34:y;   // vc: y is the vertical centre of the block
  return f.lines.map((l,i)=>`<text data-b="${bid}" x="${x}" y="${y0+i*lh}" font-family='${stack}' font-size="${f.size}" font-weight="${w}" fill="${o.fill||TK.ink}" text-anchor="${a}" opacity="${o.op==null?1:o.op}">${esc(l)}</text>`).join('')}
function th(text,o){const f=fit(text,o.size||48,o.min||40,o.w||700,o.stack||FB,o.maxW||ART.w,o.maxLines||2,o.prefer);return f.lines.length*f.size*1.12}
const rect=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx==null?16:o.rx}" fill="${o.fill||'none'}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||0}" opacity="${o.op==null?1:o.op}"/>`;
const line=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.stroke||TK.muted}" stroke-width="${o.sw||4}" stroke-linecap="round" opacity="${o.op==null?1:o.op}"/>`;
const circ=(x,y,r,o={})=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${o.fill||'none'}" stroke="${o.stroke||'none'}" stroke-width="${o.sw||0}" opacity="${o.op==null?1:o.op}"/>`;

// ---- icons: a small built-in set on a 48 x 48 grid (an item or node may name one with `icon`) ----
const ICONS={
  sun:'<circle cx="24" cy="24" r="8"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M10.5 10.5l4.2 4.2M33.3 33.3l4.2 4.2M10.5 37.5l4.2-4.2M33.3 14.7l4.2-4.2"/>',
  snow:'<path d="M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19M18 8l6 5 6-5M18 40l6-5 6 5"/>',
  flame:'<path d="M24 5c1 9-10 12-10 23 0 8 5 14 10 14s10-6 10-14c0-6-4-8-6-14-1 3-2 4-4-9z"/>',
  drop:'<path d="M24 5S12 19 12 29c0 7 5.5 13 12 13s12-6 12-13C36 19 24 5 24 5z"/>',
  bolt:'<path d="M28 4L12 26h11l-3 18 16-23H25z"/>',
  coin:'<circle cx="24" cy="24" r="17"/><path d="M29 18c0-4-10-4-10 1 0 5 10 2 10 8 0 5-10 5-10 1M24 12v4M24 33v4"/>',
  lock:'<rect x="11" y="22" width="26" height="19" rx="4"/><path d="M17 22v-6c0-9 14-9 14 0v6"/>',
  shield:'<path d="M24 5l14 5v14c0 9-7 16-14 19-7-3-14-10-14-19V10z"/><path d="M17 24l5 5 9-10"/>',
  check:'<path d="M9 25l11 11 19-22"/>',
  cross:'<path d="M12 12l24 24M36 12L12 36"/>',
  clock:'<circle cx="24" cy="24" r="17"/><path d="M24 13v11l7 4"/>',
  gear:'<circle cx="24" cy="24" r="6"/><circle cx="24" cy="24" r="13"/><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11 11l3.5 3.5M33.5 33.5L37 37M11 37l3.5-3.5M33.5 14.5L37 11"/>',
  loop:'<path d="M39 24a15 15 0 1 1-8-13.3"/><path d="M31 4v8h8"/>',
  home:'<path d="M6 24L24 8l18 16M12 21v20h24V21"/>',
  chart:'<path d="M8 6v36h34"/><path d="M14 33l8-9 6 5 12-15"/>',
  bulb:'<circle cx="24" cy="19" r="11"/><path d="M19 33h10M20 38h8M20 29v4M28 29v4"/>',
  search:'<circle cx="21" cy="21" r="12"/><path d="M30 30l12 12"/>',
  cloud:'<path d="M14 37c-7 0-9-7-4-10-1-7 7-11 12-6 2-8 13-8 14 1 6 0 8 8 3 11-1 3-3 4-6 4z"/>',
  leaf:'<path d="M9 39C9 20 22 8 41 8c0 18-12 31-32 31zM9 39l19-19"/>',
  thermo:'<path d="M20 10a4 4 0 0 1 8 0v16a9 9 0 1 1-8 0z"/>',
  arrow:'<path d="M7 24h32M28 13l11 11-11 11"/>',
  star:'<path d="M24 5l5.5 12 13 1.5-9.5 9 2.5 13L24 34l-11.5 6.5L15 27.5 5.5 18.5 18.5 17z"/>',
  person:'<circle cx="24" cy="15" r="8"/><path d="M8 42c0-10 7-15 16-15s16 5 16 15"/>',
  camera:'<rect x="6" y="14" width="36" height="24" rx="5"/><circle cx="24" cy="26" r="7"/><path d="M17 14l3-5h8l3 5"/>',
  mic:'<rect x="17" y="5" width="14" height="24" rx="7"/><path d="M10 24c0 8 6 13 14 13s14-5 14-13M24 37v6"/>',
  globe:'<circle cx="24" cy="24" r="18"/><path d="M6 24h36M24 6c-9 9-9 27 0 36M24 6c9 9 9 27 0 36"/>'
};
function icon(name,x,y,size,color,sw=3.5){const d=ICONS[name];if(!d)return '';const s=size/48;
  return `<g transform="translate(${x-size/2} ${y-size/2}) scale(${s})" fill="${color}" fill-opacity="0.16" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</g>`}
const badge=(x,y,r,name,fill,ink,op=1)=>`<g opacity="${op}">${circ(x,y,r,{fill})}${icon(name,x,y,r*1.15,ink,3.6)}</g>`;

// ---- timing: when does an item appear? `at` is a word index, a word, or omitted (spread across the beat) ----
function when(b,item,k,n){const at=item&&item.at;if(b===B[0]&&k===0)return 0.05;
  if(typeof at==='number'&&b.words[at])return b.words[at].s;
  if(typeof at==='string'){const key=norm(at);const w=b.words.find(w=>norm(w.word)===key||norm(w.word).includes(key));if(w)return w.s}
  return b.s+(k/Math.max(n,1))*Math.max(0.5,(b.e-b.s)*0.8)}
const items=(sc,key)=>(sc[key]||[]).map(x=>typeof x==='string'?{text:x}:x);

// ---- shine: a soft light sweeping across the active element, so a long beat never goes still ----
let SID=0;
function shine(x,y,w,h,t,rx=14,phase=0){const id='sh'+(SID++),c=((t+phase)%2.2)/1.5,p=clamp(c),px=x-110+(w+220)*ease(p);
  return `<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/></clipPath><g clip-path="url(#${id})" opacity="${p>0&&p<1?0.30:0}"><rect x="${px}" y="${y-10}" width="90" height="${h+20}" fill="#fff" transform="skewX(-16)" transform-origin="${px} ${y}"/></g>`}
// a dot travelling along a straight run, repeating: shows direction of flow
function dot(x1,y1,x2,y2,t,phase=0,color){const c=((t*0.9+phase)%1);return circ(x1+(x2-x1)*c,y1+(y2-y1)*c,9,{fill:color||TK.accent2,op:Math.sin(Math.PI*c)})}

// ---- count-up: "$24K", "72%", "1,250" keep their prefix, suffix and digits; it lands on the spoken word ----
function parseVal(v){const m=String(v).match(/^([^0-9\-]*)(-?[\d,]*\.?\d+)(.*)$/);if(!m)return null;
  const numstr=m[2],dec=(numstr.split('.')[1]||'').length;return{pre:m[1],num:parseFloat(numstr.replace(/,/g,'')),dec,comma:numstr.includes(','),suf:m[3]}}
function fmt(p,n){let s=n.toFixed(p.dec);if(p.comma){const [a,b]=s.split('.');s=a.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(b?'.'+b:'')}return p.pre+s+p.suf}
function count(v,t,tStart,tEnd){const p=parseVal(v);if(!p)return String(v);return fmt(p,p.num*eo(pr(t,tStart,Math.max(0.4,tEnd-tStart))))}

// ---- scenes: each returns {svg, h} (h = content height, used to centre it); items obey the QA sizes (labels >= 40 px, hero >= 140 px) ----
const scenes={
stat(b,sc,t){const t0=when(b,sc,0,1),tS=Math.max(b.s,t0-0.9),p=eo(pr(t,tS,0.35));let a='',y=0;
  const f=fit(String(sc.value),Math.min(300,sc.size||300),140,800,FH,ART.w,1,'size');const hasI=!!sc.icon;
  if(hasI){a+=badge(CX,y+60,56,sc.icon,TK.accent,TK.bg,p);y+=150}
  a+=tx(CX,y+230,count(sc.value,t,tS,t0+0.15),{size:f.size,min:140,w:800,stack:FH,fill:TK.accent2,maxLines:1,op:p,prefer:'size'});y+=290;
  if(sc.label){a+=tx(CX,y+70,sc.label,{size:60,min:44,w:700,fill:TK.ink,op:eo(pr(t,t0,0.4))});y+=70+th(sc.label,{size:60,min:44})}
  if(sc.sub){a+=tx(CX,y+60,sc.sub,{size:44,min:40,w:600,fill:TK.muted,op:eo(pr(t,t0+0.3,0.4))});y+=60+th(sc.sub,{size:44,min:40})}
  return{svg:a+shine(ART.x,hasI?150:0,ART.w,250,t,20,0),h:y}},
steps(b,sc,t){const L=items(sc,'items').slice(0,5),n=L.length;let a='';const rh=Math.min(150,(ART.h-20)/Math.max(n,1)),last=L.reduce((m,it,k)=>t>=when(b,it,k,n)?k:m,-1),bx=ART.x+56;
  if(n>1)a+=line(bx,rh/2,bx,(n-1)*rh+rh/2,{stroke:TK.muted,sw:5,op:.5});
  L.forEach((it,k)=>{const t0=when(b,it,k,n),p=back(pr(t,t0,0.5)),y=k*rh,act=k===last;if(pr(t,t0,0.5)<=0)return;const cy=y+(rh-16)/2;
    a+=`<g opacity="${clamp(p)*(act?1:.66)}" transform="translate(${(1-clamp(p))*-60} 0)">`+rect(ART.x,y,ART.w,rh-16,{fill:TK.surface,stroke:act?TK.accent2:TK.muted,sw:act?5:3})
      +(it.icon?badge(bx,cy,38,it.icon,act?TK.accent2:TK.accent,TK.bg):circ(bx,cy,38,{fill:act?TK.accent2:TK.accent})+tx(bx,cy,String(k+1),{size:48,min:40,w:800,fill:TK.bg,maxW:60,vc:true}))
      +tx(ART.x+120,cy,it.text,{size:56,min:40,a:'start',maxW:ART.w-150,maxLines:2,fill:act?TK.accent2:TK.ink,vc:true})+(act?shine(ART.x,y,ART.w,rh-16,t,16,k*0.4):'')+`</g>`});
  return{svg:a,h:n*rh}},
flow(b,sc,t){const L=items(sc,'nodes').slice(0,4),n=L.length;let a='';const bh=128,gap=Math.min(76,(ART.h-bh*n)/Math.max(n-1,1)),last=L.reduce((m,it,k)=>t>=when(b,it,k,n)?k:m,-1);
  L.forEach((it,k)=>{const t0=when(b,it,k,n),p=back(pr(t,t0,0.5)),y=k*(bh+gap);if(pr(t,t0,0.5)<=0)return;const act=k===last,q=clamp(p);
    if(k>0){a+=`<g opacity="${q}">`+line(CX,y-gap+6,CX,y-10,{stroke:TK.accent,sw:6})+`<path d="M ${CX-14} ${y-24} L ${CX} ${y-8} L ${CX+14} ${y-24}" fill="none" stroke="${TK.accent}" stroke-width="6" stroke-linecap="round"/>`+dot(CX,y-gap+6,CX,y-10,t,k*0.3)+`</g>`}
    a+=`<g opacity="${q}" transform="translate(0 ${(1-q)*30})">`+rect(ART.x+30,y,ART.w-60,bh,{fill:act?TK.accent2:TK.surface,stroke:act?TK.accent2:TK.accent,sw:4})
      +(it.icon?badge(ART.x+104,y+bh/2,40,it.icon,act?TK.bg:TK.accent,act?TK.accent2:TK.bg):'')
      +tx(it.icon?CX+46:CX,y+bh/2,it.text,{size:56,min:40,w:800,maxW:ART.w-(it.icon?250:140),fill:act?TK.bg:TK.ink,vc:true})+(act?shine(ART.x+30,y,ART.w-60,bh,t,16,k*0.4):'')+`</g>`});
  return{svg:a,h:n*bh+(n-1)*gap}},
cycle(b,sc,t){const L=items(sc,'nodes').slice(0,5),n=L.length,R=205,cy=ART.h/2-45;let a='';const ang=k=>-Math.PI/2+k*2*Math.PI/n,P=(r,th)=>[CX+r*Math.cos(th),cy+r*Math.sin(th)];
  a+=circ(CX,cy,R,{stroke:TK.muted,sw:3,op:.35});
  const times=L.map((it,k)=>when(b,it,k,n)),allIn=times.length&&t>=Math.max(...times);
  L.forEach((it,k)=>{const t1=when(b,L[(k+1)%n],(k+1)%n,n),pa=pr(t,t1-0.1,0.6);if(k<n-1||allIn){const a0=ang(k)+0.42,a1=ang(k+1)-0.42,steps=24;let d='';
      for(let s=0;s<=steps;s++){const th=a0+(a1-a0)*s/steps*(k===n-1?1:pa);const [x,y]=P(R,th);d+=(s?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
      a+=`<path d="${d}" fill="none" stroke="${TK.accent}" stroke-width="7" stroke-linecap="round" opacity="${k===n-1?pr(t,times[n-1]+0.3,0.5):1}"/>`}});
  if(allIn){const th=-Math.PI/2+((t-Math.max(...times))*0.9)%(2*Math.PI);const [x,y]=P(R,th);a+=circ(x,y,13,{fill:TK.accent2})+circ(x,y,24,{fill:TK.accent2,op:.25})}       // a dot travels the loop: it is closed and it keeps going
  L.forEach((it,k)=>{const t0=times[k],p=back(pr(t,t0,0.5)),q=clamp(p);if(q<=0)return;const [x,y]=P(R,ang(k)),act=!allIn&&k===times.reduce((m,tt,i)=>t>=tt?i:m,-1);
    a+=`<g opacity="${q}" transform="translate(${x} ${y}) scale(${0.6+0.4*q}) translate(${-x} ${-y})">`+circ(x,y,60,{fill:act?TK.accent2:TK.surface,stroke:act?TK.accent2:TK.accent,sw:5})+(it.icon?icon(it.icon,x,y,64,act?TK.bg:TK.accent,3.8):tx(x,y,String(k+1),{size:56,min:40,w:800,vc:true,maxW:80}))
      +tx(x,y+(Math.sin(ang(k))>0.5?106:(Math.sin(ang(k))<-0.5?-82:92)),it.text,{size:44,min:40,maxW:210,maxLines:2,vc:Math.abs(Math.sin(ang(k)))>0.5})+`</g>`});
  if(sc.center)a+=tx(CX,cy,sc.center,{size:56,min:40,w:800,stack:FH,maxW:300,maxLines:3,vc:true,fill:TK.accent2,op:eo(pr(t,b.s+0.2,0.5))});
  return{svg:a,h:ART.h-60}},
compare(b,sc,t){const cols=[sc.left||{},sc.right||{}],w=(ART.w-48)/2;let a='';let k=0;const tot=cols.length*2;
  cols.forEach((c,ci)=>{const x=ART.x+ci*(w+48),t0=when(b,c,k++,tot),p=eo(pr(t,t0,0.4)),thh=th(c.title||'',{size:52,min:40,w:800,maxW:w-40,maxLines:2});
    a+=`<g opacity="${p}">`+rect(x,0,w,600,{fill:TK.surface,stroke:ci?TK.accent2:TK.accent,sw:5})+(c.icon?badge(x+w/2,64,44,c.icon,ci?TK.accent2:TK.accent,TK.bg):'')
      +tx(x+w/2,(c.icon?150:72),c.title||'',{size:52,min:40,w:800,maxW:w-40,fill:ci?TK.accent2:TK.accent})+line(x+30,(c.icon?150:72)+thh-24,x+w-30,(c.icon?150:72)+thh-24,{stroke:TK.muted,sw:3})+`</g>`;
    items(c,'items').slice(0,3).forEach((it,j)=>{const q=eo(pr(t,when(b,it,k++,tot),0.4));
      a+=tx(x+w/2,(c.icon?150:72)+thh+54+j*128,it.text,{size:46,min:40,maxW:w-50,maxLines:3,op:q})})});
  return{svg:a+tx(CX,300,'vs',{size:44,min:40,w:800,fill:TK.muted,op:eo(pr(t,when(b,cols[1],1,2),0.3))}),h:600}},
bars(b,sc,t){const L=items(sc,'items').slice(0,5),n=L.length,mx=Math.max(...L.map(x=>+x.value||0),1);let a='';const rh=Math.min(150,(ART.h-20)/Math.max(n,1));
  L.forEach((it,k)=>{const t0=when(b,it,k,n),p=eo(pr(t,t0,0.9)),y=k*rh;if(pr(t,t0,0.2)<=0)return;const bw=(ART.w-20)*(+it.value/mx)*p,bhh=rh-84;
    a+=tx(ART.x,y+40,it.label,{size:44,min:40,a:'start',maxW:ART.w,maxLines:1,fill:TK.muted})+rect(ART.x,y+54,Math.max(bw,4),bhh,{fill:k%2?TK.accent2:TK.accent,rx:12})
      +tx(Math.min(ART.x+bw+14,ART.x+ART.w-10),y+54+bhh/2,count(String(it.value)+(sc.unit||''),t,t0,t0+0.9),{size:52,min:40,a:bw>ART.w-260?'end':'start',w:800,maxW:260,maxLines:1,fill:TK.ink,vc:true})});
  return{svg:a+line(ART.x,0,ART.x,n*rh-24,{stroke:TK.muted,sw:3}),h:n*rh}},
kinetic(b,sc,t){const L=(sc.lines||[]).slice(0,4).map(l=>typeof l==='string'?{text:l}:l);let a='';
  const hs=L.map(l=>th(l.text,{size:130,min:90,w:800,stack:FH,maxLines:2,prefer:'size'})),gap=34,total=hs.reduce((m,h)=>m+h,0)+gap*(L.length-1);let y=0;
  L.forEach((it,k)=>{const p=back(pr(t,when(b,it,k,L.length),0.4)),cy=y+hs[k]/2;y+=hs[k]+gap;if(pr(t,when(b,it,k,L.length),0.4)<=0)return;
    a+=tx(CX,cy+(1-clamp(p))*36,it.text,{size:130,min:90,w:800,stack:FH,maxLines:2,prefer:'size',op:clamp(p),fill:k===L.length-1&&L.length>1?TK.accent2:TK.ink,vc:true});
    if(k===L.length-1&&t>when(b,it,k,L.length))a+=shine(ART.x,cy-hs[k]/2,ART.w,hs[k],t,20,0)});return{svg:a,h:total}},
terminal(b,sc,t){const L=(sc.lines||[]).slice(0,6);let a='';const w=ART.w,h=76+L.length*70;
  a+=rect(ART.x,0,w,h,{fill:TK.surface,stroke:TK.accent,sw:4})+[0,1,2].map(i=>circ(ART.x+34+i*32,34,9,{fill:[TK.accent2,TK.accent,TK.muted][i]})).join('');
  L.forEach((l,k)=>{const t0=when(b,{at:l.at},k,L.length),txt=typeof l==='string'?l:l.text,p=pr(t,t0,0.9);if(p<=0)return;
    a+=tx(ART.x+28,100+k*70,(k===L.length-1?'> ':'')+txt.slice(0,Math.ceil(txt.length*p)),{size:40,min:40,a:'start',stack:FM,maxW:w-56,maxLines:1,w:600,fill:k===L.length-1?TK.accent2:TK.ink,vc:true})});return{svg:a,h}},
quote(b,sc,t){const p=eo(pr(t,when(b,sc,0,1),0.5));let a=tx(ART.x+20,150,'“',{size:200,min:200,a:'start',stack:FH,w:800,fill:TK.accent,op:p,maxLines:1});
  a+=tx(CX,280,sc.text||'',{size:64,min:44,w:700,stack:FH,maxLines:5,op:p,prefer:'size'});
  if(sc.by)a+=tx(CX,620,'— '+sc.by,{size:44,min:40,w:600,fill:TK.muted,op:eo(pr(t,when(b,sc,0,1)+0.5,0.4))});return{svg:a,h:640}}
};

// ---- frame ----
function bgSvg(t){let s='';
  const blobs=[[200,420,420,TK.accent,.20,.11,.07],[880,1100,500,TK.accent2,.14,.08,.06],[540,1500,560,TK.accent,.12,.06,.09]];      // slow drifting light: ambient motion, never a flash
  s+='<defs>'+blobs.map((b,i)=>`<radialGradient id="g${i}"><stop offset="0" stop-color="${b[3]}" stop-opacity="${b[4]}"/><stop offset="1" stop-color="${b[3]}" stop-opacity="0"/></radialGradient>`).join('')+'</defs>';
  blobs.forEach((b,i)=>{s+=`<circle cx="${b[0]+90*Math.sin(t*b[5]*3+i*2)}" cy="${b[1]+70*Math.cos(t*b[6]*3+i)}" r="${b[2]}" fill="url(#g${i})"/>`});
  if(ST.texture==='grid'){const ox=-(t*4)%240,oy=-(t*2)%240;
    for(let x=ox-240;x<1320;x+=48){const mj=Math.round((x-ox)/48)%5===0;s+=line(x,0,x,1920,{stroke:'#fff',sw:mj?2:1,op:mj?.14:.06})}
    for(let y=oy-240;y<2160;y+=48){const mj=Math.round((y-oy)/48)%5===0;s+=line(0,y,1080,y,{stroke:'#fff',sw:mj?2:1,op:mj?.14:.06})}}return s}
function chunks(b){const out=[];let cur=[],len=0;b.words.forEach(w=>{if(cur.length&&(cur.length>=4||len+w.word.length+1>22)){out.push(cur);cur=[];len=0}cur.push(w);len+=w.word.length+1;if(/[.?!…]$/.test(w.word)||(/[,:;]$/.test(w.word)&&cur.length>=2)){out.push(cur);cur=[];len=0}});
  if(cur.length)out.push(cur);return out}
const CH=B.map(chunks);
function caption(t,i){let cur=null;for(const c of CH[i])if(t>=c[0].s-0.02)cur=c;if(!cur||t>B[i].e+0.5)return '';
  return `<span class="pill" style="background:${TK.panel||'rgba(0,0,0,.6)'};border:3px solid ${TK.muted};color:${TK.ink};font-family:${FB.replace(/"/g,"'")}">`+cur.map(w=>`<span style="color:${t>=w.s?TK.accent2:TK.ink}">${esc(w.word)}</span>`).join(' ')+'</span>'}

function sceneOf(b){return b.scene||{type:'kinetic',lines:[b.words.map(w=>w.word).join(' ')]}}
function artFor(i,t){const b=B[i],sc=sceneOf(b),fn=scenes[sc.type]||scenes.kinetic;let a='';
  const hasTitle=sc.title&&sc.type!=='kinetic',top=hasTitle?ART.y+30:ART.y;
  if(hasTitle)a+=tx(CX,SAFE.y+70,sc.title,{size:56,min:44,w:800,stack:FH,fill:TK.accent,maxLines:2,vc:true});
  const r=fn(b,sc,t),room=ART.h-(hasTitle?30:0),off=Math.max(0,(room-r.h)/2);      // centre the scene's content in the space it has
  return a+`<g transform="translate(0 ${top+off})">${r.svg}</g>`}
async function render(t){
  t=Math.min(Math.max(t,0),D-1/60);let i=0;for(let k=0;k<B.length;k++)if(t>=vs[k])i=k;const u=t-vs[i];
  document.getElementById('stage').style.background=`linear-gradient(180deg, ${TK.bg} 0%, ${TK.surface} 120%)`;
  document.getElementById('bg').innerHTML=bgSvg(t);
  // a slow push toward the active part of the scene, alternating side per beat (a reframe, not a flash)
  const dur=ve[i]-vs[i],k=1+0.035*ease(u/Math.max(dur,0.5)),sx=(i%2?-1:1)*10*ease(u/Math.max(dur,0.5));
  const pivot=`translate(${CX+sx} 720) scale(${k}) translate(${-CX} -720)`;
  const inP=ease(u/0.3);let art='';
  if(u<0.3&&i>0)art+=`<g opacity="${1-inP}" transform="translate(0 ${-24*inP})">${artFor(i-1,vs[i]-0.001)}</g>`;
  art+=`<g opacity="${i>0?inP:eo(pr(u,0.1,0.3))}" transform="translate(0 ${(1-(i>0?inP:1))*24})"><g transform="${pivot}">${artFor(i,t)}</g></g>`;
  if(new URLSearchParams(location.search).get('guides'))art+=rect(SAFE.x,SAFE.y,SAFE.w,SAFE.h,{stroke:'#f0f',sw:2});
  document.getElementById('art').innerHTML=art;
  document.getElementById('cap').innerHTML=V.captions===false?'':caption(t,i);return i}
window.render=render;window.DUR=D;window.SCENES=Object.keys(scenes);window.ICON_NAMES=Object.keys(ICONS);
</script></body></html>
